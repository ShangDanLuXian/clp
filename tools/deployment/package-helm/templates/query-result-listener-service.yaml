{{- if and .Values.clpConfig.api_server .Values.spider.enabled }}
apiVersion: "v1"
kind: "Service"
metadata:
  name: {{ include "clp.fullname" . }}-query-result-listener
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "api-server"
spec:
  # Separate from the API server's service so that only pods in the cluster (the Spider workers
  # running query tasks) can reach the listener, whatever `api_server.serviceType` is.
  type: "ClusterIP"
  selector:
    {{- include "clp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: "api-server"
  ports:
    - name: "query-results"
      port: 3003
      targetPort: "query-results"
{{- end }}
