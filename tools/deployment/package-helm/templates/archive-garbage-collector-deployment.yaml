{{- if eq .Values.clpConfig.package.storage_engine "clp-s" }}
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: {{ include "clp.fullname" . }}-archive-garbage-collector
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "archive-garbage-collector"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "archive-garbage-collector"
  template:
    metadata:
      labels:
        {{- include "clp.labels" . | nindent 8 }}
        app.kubernetes.io/component: "archive-garbage-collector"
    spec:
      {{- include "clp.createSchedulingConfigs" (dict
          "root" .
          "component" "archiveGarbageCollector"
        ) | nindent 6 }}
      serviceAccountName: {{ include "clp.fullname" . }}-service-account
      terminationGracePeriodSeconds: 10
      initContainers:
        - {{- include "clp.waitFor" (dict
            "root" .
            "type" "job"
            "name" "db-table-creator"
          ) | nindent 10 }}
      containers:
        - name: "archive-garbage-collector"
          image: {{ include "clp.imageRef" (dict "root" . "component" "clpPackage") | quote }}
          imagePullPolicy: "{{ .Values.image.clpPackage.pullPolicy }}"
          env:
            - name: "CLP_DB_PASS"
              valueFrom:
                secretKeyRef:
                  name: {{ include "clp.fullname" . }}-database
                  key: "password"
            - name: "CLP_DB_USER"
              valueFrom:
                secretKeyRef:
                  name: {{ include "clp.fullname" . }}-database
                  key: "username"
            - name: "RUST_LOG"
              value: {{ .Values.clpConfig.garbage_collector.logging_level | quote }}
          {{- include "clp.createResourceLimits" (dict
              "root" .
              "component" "archiveGarbageCollector"
            ) | nindent 10 }}
          volumeMounts:
            - name: "config"
              mountPath: "/etc/clp-config.yaml"
              subPath: "clp-config.yaml"
              readOnly: true
            {{- if eq .Values.global.archiveOutputStorageType "fs" }}
            - name: {{ include "clp.volumeName" (dict
                "component_category" "shared-data"
                "name" "archives"
              ) | quote }}
              mountPath: "/var/data/archives"
            {{- end }}
            {{- if .Values.clpConfig.aws_config }}
            - {{- include "clp.awsConfigVolumeMount" . | nindent 14 }}
            {{- end }}
          command: [
            "/opt/clp/bin/archive-garbage-collector",
            "--config", "/etc/clp-config.yaml"
          ]
      volumes:
        - name: "config"
          configMap:
            name: {{ include "clp.fullname" . }}-config
        {{- if eq .Values.global.archiveOutputStorageType "fs" }}
        - {{- include "clp.pvcVolume" (dict
            "root" .
            "component_category" "shared-data"
            "name" "archives"
          ) | nindent 10 }}
        {{- end }}
        {{- if .Values.clpConfig.aws_config }}
        - {{- include "clp.awsConfigVolume" . | nindent 10 }}
        {{- end }}
{{- end }}
